name: Changelog Update

on:
  push:
    branches:
      - 'dev-*'
    paths-ignore:
      - '**/CHANGELOG.md'


permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Module Changelogs
        run: |
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          CURRENT_DATE=$(date +'%Y-%m-%d')
          
          MODES_TO_UPDATE=$(echo "$CHANGED_FILES" | grep '/' | cut -d'/' -f1 | uniq)

          for MODULE in $MODES_TO_UPDATE; do
            if [ -f "$MODULE/__manifest__.py" ]; then
              CHANGELOG_PATH="$MODULE/CHANGELOG.md"
              ENTRY="- **$CURRENT_DATE**: $COMMIT_MSG"
              
              if [ ! -f "$CHANGELOG_PATH" ]; then
                echo -e "# Changelog\n\n$ENTRY" > "$CHANGELOG_PATH"
              else
                # Inserisce dopo l'intestazione principale
                sed -i "/# Changelog/a \ \n$ENTRY" "$CHANGELOG_PATH"
                sed -i '/^$/N;/^\n$/D' "$CHANGELOG_PATH"
              fi
            fi
          done

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # CORRETTO: Aggiunto il trattino mancante in --quiet
          git diff --staged --quiet || (git commit -m "chore: update changelog [skip ci]" && git push)